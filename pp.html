<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOND</title>
  <style>
    /* لوحة الألوان الجديدة */
    :root {
      --light-pink: #F3CCDE;
      --pastel-rose: #D6A8C4;
      --medium-lilac: #BA88AE;
      --dusty-purple: #9E6899;
      --dark-purple: #5B3765;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--light-pink);
      color: var(--dark-purple);
      min-height: 100vh;
    }

    /* شاشة كلمة السر overlay */
    .password-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background: linear-gradient(135deg, var(--dark-purple), var(--dusty-purple), var(--medium-lilac));
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .password-box {
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(91, 55, 101, 0.25);
      text-align: center;
      max-width: 360px;
      width: 90%;
      border: 2px solid var(--pastel-rose);
    }

    .password-box h2 {
      color: var(--dark-purple);
      font-size: 1.3rem;
      margin-bottom: 20px;
    }

    .password-box input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--pastel-rose);
      border-radius: 10px;
      outline: none;
      font-size: 1.1rem;
      text-align: center;
      margin-bottom: 15px;
      transition: border-color 0.3s;
      background-color: #fff;
      color: var(--dark-purple);
    }

    .password-box input:focus {
      border-color: var(--dusty-purple);
    }

    .password-box button {
      width: 100%;
      padding: 12px;
      background-color: var(--dark-purple);
      color: var(--light-pink);
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s;
    }

    .password-box button:hover {
      background-color: var(--dusty-purple);
      transform: translateY(-2px);
    }

    .error-msg {
      color: #c0392b;
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 18px;
      font-weight: bold;
    }

    /* التحكم في الإخفاء والإظهار */
    .hidden {
      display: none !important;
    }

    /* المحتوى الرئيسي للموقع */
    .main-content {
      padding: 40px 20px;
      text-align: center;
    }

    .main-content h1 {
      color: var(--dark-purple);
    }
  </style>
</head>
<body>

  <!-- شاشة كلمة السر -->
  <div id="password-screen" class="password-overlay">
    <div class="password-box">
      <h2>أدخل كلمة السر للدخول</h2>
      <input type="password" id="password-input" placeholder="كلمة السر...">
      <button onclick="checkPassword()">دخول</button>
      <p id="error-message" class="error-msg"></p>
    </div>
  </div>

  <!-- المحتوى الرئيسي للموقع (يظهر بعد كلمة السر) -->
  <div id="main-content" class="main-content hidden">
    <h1>مرحباً بك في الموقع!</h1>
    <!-- هنضيف بقية الأقسام هنا خطوة بخطوة -->
  </div>

  <script>
    // كلمة السر المعتمدة
    const correctPassword = "1911";

    function checkPassword() {
      const inputField = document.getElementById("password-input");
      const errorMessage = document.getElementById("error-message");
      const passwordScreen = document.getElementById("password-screen");
      const mainContent = document.getElementById("main-content");

      if (inputField.value === correctPassword) {
        passwordScreen.classList.add("hidden");
        mainContent.classList.remove("hidden");
      } else {
        errorMessage.textContent = "كلمة السر غير صحيحة، حاولي مرة أخرى.";
        inputField.value = "";
      }
    }

    // الضغط على Enter للدخول مباشرة
    document.getElementById("password-input").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        checkPassword();
      }
    });
  </script>
</body>
</html>
